<title>FOKUS</title>
<style>
:root{
  color-scheme:dark;
  --bg:#080C0E; --bg-2:#0D1315; --surface:#141B1E; --surface-2:#192225; --ink:#F2F5F6; --muted:#A1AAAF; --faint:#687277; --line:#263137; --line-2:#1D272B;
  --accent:#35F29A; --accent-dark:#15945A; --accent-ink:#06100B; --accent-soft:#101D18;
  --blue:#4D8DFF; --blue-soft:#6FA4FF; --orange:#FF7A3D; --purple:#9A6BFF;
  --gold:#F5C542; --gold-soft:#2A2412; --red:#FF5C5C; --red-soft:#351A1B; --green:#35F29A; --green-soft:#0F2519;
  --h0:#1D272B; --h1:#0F3A28; --h2:#15945A; --h3:#25C47C; --h4:#63EFA9;
  --body:#2A3438; --body-edge:#354247;
  --av-base:#4A565C; --av-m0:#66737A; --av-m1:#27447A; --av-m2:#3569CC; --av-m3:#4D8DFF; --av-m4:#9CC0FF;
  --ph-men:#FF6B82; --ph-fol:#35C99A; --ph-ovu:#F5C542; --ph-lut:#9A6BFF; --ph-lut2:#BCA2FF;
  --shadow:0 8px 24px rgba(0,0,0,.20);
  --r-s:10px; --r-m:14px; --r-l:18px;
  --display:"Bebas Neue","Arial Narrow",Arial,sans-serif;
  --body-font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --brand-font:"Montserrat","Inter",sans-serif;
  --ai-grad:linear-gradient(135deg,#9A6BFF,#35F29A);
  --sec:var(--accent);
}
@font-face{font-family:"Inter";src:url(fonts/inter.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Bebas Neue";src:url(fonts/bebas.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Montserrat";src:url(fonts/montserrat-900.woff2) format("woff2");font-weight:900;font-display:swap}
*{box-sizing:border-box}
html,body{background:var(--bg)}
:root{padding-top:0!important;padding-bottom:0!important;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
body{color:var(--ink);font-family:var(--body-font);font-size:15px;line-height:1.45;padding:0 16px;padding-block:calc(var(--hh,96px) + 14px) calc(170px + var(--sab));overscroll-behavior-y:none}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance;line-height:1.05}
.num{font-variant-numeric:tabular-nums}

header.top{position:fixed;top:0;left:0;right:0;z-index:15;background:var(--bg);padding:calc(10px + var(--sat)) 16px 8px;border-bottom:1px solid var(--line);box-shadow:0 6px 16px -10px rgba(0,0,0,.35)}
header.top .row{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;height:44px}
header.top .brand{min-width:0}
header.top .brand h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sync{display:none}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:24px;font-weight:800}
.brand svg{width:28px;height:28px;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
.chip.flame{background:var(--gold-soft);border-color:transparent;color:var(--ink)}
.sync{font-size:11px;color:var(--muted);text-align:right;max-width:560px;margin:4px auto 0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.eyebrow{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:10px}
.rowx{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.sec-title{font-size:30px;font-weight:800}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;min-height:40px}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);border-color:var(--red-soft)}
.btn.danger.solid{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.btn.big{min-height:52px;font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.04em}
.linkbtn{background:none;border:none;color:var(--accent);font-weight:600;padding:4px 0}

.hero-date{font-family:var(--display);font-weight:800;font-size:40px;text-transform:uppercase;line-height:.95}
.rp{display:flex;align-items:center;gap:12px;justify-content:space-between}
.rp h3{font-size:22px}
.rp .meta{font-size:13px;color:var(--muted)}

.sess-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.sess-head h2{font-size:30px;font-weight:800}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-family:var(--display);font-size:22px;font-weight:700;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}

.ex{padding:14px}
.ex-title{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ex-title h3{font-size:21px}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.last{font-size:13px;color:var(--muted);margin-top:4px}
.suggest{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--gold-soft);border-radius:10px;padding:8px 10px;margin-top:10px;font-size:13px}
.sets{width:100%;border-collapse:separate;border-spacing:0 8px;margin-top:6px}
.sets th{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:0 4px}
.sets td{padding:0 3px;vertical-align:middle}
.sets tr.done td.n{color:var(--green)}
.sets td.n{font-family:var(--display);font-weight:700;font-size:18px;width:26px;text-align:center}
.inp{width:100%;min-width:0;height:48px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:0 6px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600;font-size:16px}
.sets tr.done .inp{background:var(--green-soft);border-color:transparent}
.stk-btn{width:60px;height:60px;border-radius:12px;border:1.5px dashed var(--line);background:transparent;display:grid;place-items:center;padding:0;font-size:40px;line-height:1}
.stk-btn.has{border:none;background:transparent}
.stk-btn .stk-img{width:56px;height:56px}
.check{width:48px;height:48px;border-radius:10px;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center;padding:0}
.check svg{width:22px;height:22px;stroke:var(--muted)}
.check.on{background:var(--green);border-color:var(--green)}
.check.on svg{stroke:#fff}
.pr{display:inline-block;font-size:11px;font-weight:800;color:var(--gold);letter-spacing:.04em}
.ex-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
textarea.note{width:100%;min-height:60px;border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:8px;resize:vertical;margin-top:8px}
.note-view{font-size:13px;background:var(--surface-2);border-radius:8px;padding:6px 10px;margin-top:8px}

.stk-img{width:1.3em;height:1.3em;object-fit:contain;vertical-align:middle;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.sheet-bg{position:fixed;inset:0;background:rgba(10,12,14,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:85vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + var(--sab));box-shadow:0 -10px 30px rgba(0,0,0,.2)}
.stk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stk-opt{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600;text-align:center}
.stk-opt .e{font-size:56px;line-height:1;height:76px;display:grid;place-items:center}
.stk-opt .e .stk-img{width:76px;height:76px}
.stk-opt.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.stamp{position:fixed;inset:0;z-index:40;display:grid;place-items:center;pointer-events:none}
.stamp span{font-size:150px;line-height:1;animation:pop .9s ease-out forwards}
.stamp .stk-img{width:190px;height:190px}
@keyframes pop{0%{transform:scale(.3) rotate(-12deg);opacity:0}25%{transform:scale(1.1) rotate(4deg);opacity:1}45%{transform:scale(1) rotate(0)}80%{opacity:1}100%{transform:scale(1.05);opacity:0}}

.mood{display:flex;gap:16px;align-items:center}
.mood .big{font-size:76px;line-height:1;flex:none}
.mood .big .stk-img{width:96px;height:96px}
.mood h2{font-size:28px}

#timer{position:fixed;left:0;right:0;bottom:calc(64px + var(--sab));z-index:10;display:flex;justify-content:center;padding:0 16px}
#timer .t{width:100%;max-width:560px;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#timer .clock{font-family:var(--display);font-weight:800;font-size:32px;min-width:78px;font-variant-numeric:tabular-nums}
#timer .lbl{flex:1;font-size:12px;opacity:.8;line-height:1.2}
#timer button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;min-height:36px;padding:0 10px;font-weight:600;opacity:.9}
#timer .ring{height:4px;background:rgba(127,127,127,.35);border-radius:9px;overflow:hidden;margin-top:4px}
#timer .ring i{display:block;height:100%;background:var(--gold)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--surface);border-top:1px solid var(--line);padding-bottom:var(--sab)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
nav.tabs{height:calc(62px + var(--sab))}
nav.tabs button{background:none;border:none;height:62px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.02em;font-size:10.5px;color:var(--muted);padding:0 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.tabs button svg{flex:none}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent)}

#toast{position:fixed;top:calc(70px + var(--sat));left:50%;transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25);text-align:center}
#toast.gold{background:var(--gold);color:#1a1400}

/* ciclo */
.cyc-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.cyc-day{font-family:var(--display);font-weight:800;font-size:44px;line-height:.9}
.phase-name{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase}
.cyc-bar{position:relative;display:flex;height:14px;border-radius:99px;overflow:visible;margin:14px 0 18px;gap:2px}
.cyc-bar span{height:100%;border-radius:4px}
.cyc-bar .mk{position:absolute;top:-5px;width:4px;height:24px;background:var(--ink);border-radius:2px;transform:translateX(-50%)}
.cyc-bar .mk::after{content:attr(data-l);position:absolute;top:26px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;white-space:nowrap;color:var(--ink)}
.pc-men{background:var(--ph-men)} .pc-fol{background:var(--ph-fol)} .pc-ovu{background:var(--ph-ovu)} .pc-lut{background:var(--ph-lut)} .pc-lut2{background:var(--ph-lut2)}
.tip{border-left:4px solid var(--c,var(--accent));background:var(--surface-2);border-radius:0 10px 10px 0;padding:10px 12px;font-size:14px}
.tip b{display:block;margin-bottom:2px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
.pill.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.disclaimer{font-size:12px;color:var(--muted);margin:0}

/* calendario */
.week-dots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--muted)}
.wd i{width:30px;height:30px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-style:normal;font-size:14px}
.wd i.on{background:var(--accent);color:var(--accent-ink)}
.wd i.today{box-shadow:0 0 0 2px var(--accent)}
.streak-big{font-family:var(--display);font-weight:800;font-size:54px;line-height:.9}
.cal-head{display:flex;justify-content:space-between;align-items:center}
.cal-head h2{font-size:24px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.cal .dow{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding-bottom:2px}
.day{aspect-ratio:1;max-width:100%;border-radius:8px;border:none;background:var(--h0);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--ink);padding:0;position:relative;overflow:hidden}
.day.l1{background:var(--h1)} .day.l2{background:var(--h2)} .day.l3{background:var(--h3);color:#fff} .day.l4{background:var(--h4);color:#fff}
.day.out{visibility:hidden}
.day.today{box-shadow:inset 0 0 0 2px var(--ink)}
.day.sel{outline:2px solid var(--gold);outline-offset:1px}
.day .dst{font-size:14px;line-height:1}
.day .dst .stk-img{width:18px;height:18px}
.day .ph{position:absolute;left:4px;right:4px;bottom:3px;height:4px;border-radius:2px}
.day .ph.pred{opacity:.9;background:repeating-linear-gradient(90deg,var(--c) 0 3px,transparent 3px 6px)!important}
.day .ph.men{background:var(--ph-men);--c:var(--ph-men)} .day .ph.ovu{background:var(--ph-ovu);--c:var(--ph-ovu)}
.legend{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);justify-content:flex-end;flex-wrap:wrap}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.legend .ln{width:16px;height:4px;border-radius:2px;display:inline-block}
.detail-ex{border-top:1px solid var(--line);padding-top:8px}
.setline{font-size:14px;display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.setline span{background:var(--surface-2);border-radius:7px;padding:2px 8px;display:inline-flex;align-items:center;gap:4px}
.setline .stk-img{width:26px;height:26px}

/* progreso */
.level{display:flex;gap:16px;align-items:center}
.level svg{width:118px;height:118px;flex:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.22))}
.lvl{font-family:var(--display);font-weight:800;font-size:30px;text-transform:uppercase;line-height:1}
.bigkg{font-family:var(--display);font-weight:800;font-size:46px;line-height:1}
.compare{font-size:17px;font-weight:600;margin-top:6px}
.bodymap{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.bodymap figure{margin:0;text-align:center}
.bodymap figcaption{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.bodymap svg{width:100%;max-width:190px;height:auto}
.bodymap .sil{fill:var(--body);stroke:var(--body-edge);stroke-width:1}
.bodymap .mu{stroke:var(--surface);stroke-width:1.3;stroke-linejoin:round}
.m0{fill:var(--body-edge)} .m1{fill:var(--h1)} .m2{fill:var(--h2)} .m3{fill:var(--h3)} .m4{fill:var(--h4)}
.pr-list{display:flex;flex-direction:column}
.pr-item{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.pr-item:first-child{border-top:none}
.share{background:var(--accent);color:var(--accent-ink);border:none}
.share .eyebrow{color:inherit;opacity:.8}
.share h2{font-size:28px}
.share .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.share .grid2 b{display:block;font-family:var(--display);font-size:28px;font-weight:800;line-height:1}
.share .grid2 span{font-size:12px;opacity:.85}
.share .btn{background:var(--accent-ink);color:var(--accent);border-color:transparent}
.share .stk-img{width:44px;height:44px}
.phase-table{width:100%;border-collapse:collapse;font-size:14px}
.phase-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:4px 4px 6px}
.phase-table td{padding:7px 4px;border-top:1px solid var(--line)}
.phase-table td .rowx{flex-wrap:nowrap;white-space:nowrap}
.phase-table td:not(:first-child),.phase-table th:not(:first-child){text-align:right}

/* rutinas / ajustes */
.rt-ex{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.rt-ex .full{grid-column:1/-1}
.rt-ex .nums{display:flex;gap:6px;align-items:center}
.field{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600}
.field input,.field select{height:40px;border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:0 10px;color:var(--ink);font-weight:500;width:100%;min-width:0}
.title-inp{font-family:var(--display);font-size:22px;font-weight:700;text-transform:uppercase;border:none;border-bottom:1px dashed var(--line);background:transparent;width:100%;padding:2px 0}
.mystk{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mystk .stk-opt{position:relative}
.mystk .del{position:absolute;top:4px;right:6px;background:var(--surface);border:1px solid var(--line);border-radius:50%;width:26px;height:26px;color:var(--red);font-weight:800;font-size:15px;line-height:1;padding:0}
.upload{display:flex;align-items:flex-start;gap:12px}
.preview{width:96px;height:96px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;font-size:64px;overflow:hidden;flex:none}
.preview img{width:100%;height:100%;object-fit:contain}
.filebtn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center}
.filebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:0}
.pastezone{width:100%;min-height:40px;border:1px dashed var(--line);border-radius:10px;background:var(--bg);padding:9px 10px;resize:none;font-size:14px;color:var(--ink)}
.dropzone{border:1.5px dashed var(--line);border-radius:10px;padding:14px;text-align:center}
.dropzone.over{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:none;background:transparent;padding:8px;font-weight:600;min-height:40px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.confirm{background:var(--red-soft);border-radius:10px;padding:10px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}
.starts{display:flex;flex-direction:column}
.starts div{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.starts div:first-child{border-top:none}
.sets tr.next td{background:var(--accent-soft)}
.sets tr.next td:first-child{border-radius:12px 0 0 12px}
.sets tr.next td:last-child{border-radius:0 12px 12px 0}
.sets tr.next td{padding-top:6px;padding-bottom:6px}
.sets tr.next .inp{border:2px solid var(--accent);background:var(--surface)}

.ex.current{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent),var(--shadow)}
.now{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:6px}

/* teclado propio */
.inp{font-family:var(--body-font)}
button.inp{cursor:pointer;color:var(--ink)}

.inp.editing{border:2px solid var(--gold)!important;background:var(--gold-soft)!important;color:var(--ink)}
#pad{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;justify-content:center}
#pad:empty{display:none}
.pad{width:100%;max-width:560px;background:var(--surface);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -12px 30px rgba(0,0,0,.25);padding:10px 12px calc(12px + var(--sab));display:flex;flex-direction:column;gap:8px}
.pad-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pad-vals{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pad-vals.one{grid-template-columns:1fr}
.pv{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:6px 12px;display:flex;justify-content:space-between;align-items:center;color:var(--ink)}
.pv span{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.pv b{font-family:var(--display);font-size:30px;font-weight:800;line-height:1.1}
.pv.on{border:2px solid var(--gold);background:var(--gold-soft)}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.key{height:52px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-family:var(--display);font-size:26px;font-weight:700;color:var(--ink);padding:0;touch-action:manipulation}
.key:active{background:var(--surface-2)}
.key.adj{font-size:18px;background:var(--surface-2)}
.key.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:20px}
.pad-done{background:var(--green);color:#fff;border-color:var(--green);min-height:48px}
body.padopen{padding-bottom:460px}
body.padopen #timer{display:none}
/* selector */
#picker[hidden]{display:none}
.picker{position:fixed;inset:0;z-index:46;background:var(--bg);display:flex;flex-direction:column;gap:10px;padding:calc(12px + var(--sat)) 16px 0}
.pk-head{display:flex;justify-content:space-between;align-items:center;max-width:560px;width:100%;margin:0 auto}
.pk-head h2{font-size:26px}
.pk-search{width:100%;max-width:560px;margin:0 auto;height:46px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px;font-size:16px;color:var(--ink)}
.pk-search:focus{border-color:var(--accent);outline:none}
.pk-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;max-width:560px;width:100%;margin:0 auto;scrollbar-width:none}
.pk-chips .pill{flex:none}
.pk-list{flex:1;overflow-y:auto;max-width:560px;width:100%;margin:0 auto;padding-bottom:calc(24px + var(--sab));-webkit-overflow-scrolling:touch}
.pk-sec{padding:12px 0 4px}
.pk-item{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:6px;font-size:16px;font-weight:600;color:var(--ink)}

body.noscroll{overflow:hidden}
.fbtn{height:40px;border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:0 10px;color:var(--ink);font-weight:600;font-size:15px;width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left}

/* escribiendo con el teclado del móvil */
body.typing nav.tabs,body.typing #timer{display:none}
body.typing{padding-bottom:40vh}

/* teclado de letras */

body.kbopen{padding-bottom:380px}

.picker .pk-list{padding-bottom:calc(24px + var(--sab))}

button.pk-search{text-align:left;display:flex;align-items:center}
button.title-inp{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;color:var(--ink);cursor:pointer}
button.note-view{display:block;width:100%;text-align:left;border:none;color:var(--ink)}
.emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;max-height:196px;overflow-y:auto;padding:2px}

/* maniquí 3D */
.av-slot{margin-top:6px;border-radius:14px;background:radial-gradient(ellipse at 50% 40%,var(--surface-2),var(--surface) 72%);overflow:hidden}

.bodymap[hidden]{display:none}

:root{--bm-sil:#AEB7BC;--bm-n:#C6CDD1;--bm-t:#DDE2E5;--bm-hair:#5B4A42}
:root{--bm-sil:#2F3A3F;--bm-n:#425464;--bm-t:#526066;--bm-hair:#8A7466}
.bodymap.real svg{max-width:210px}
.bm-cv{display:block;width:100%;max-width:200px;height:auto;margin:0 auto;cursor:pointer;-webkit-tap-highlight-color:transparent}
.bodymap.real{align-items:end}
.bm-sil{fill:var(--bm-sil)}
.bm-n{fill:var(--bm-n);stroke:var(--surface);stroke-width:.35;stroke-linejoin:round}
.bm-t{fill:var(--bm-t);stroke:var(--surface);stroke-width:.3}

.bm-l0{fill:var(--bm-n)} .bm-l1{fill:var(--h1)} .bm-l2{fill:var(--h2)} .bm-l3{fill:var(--h3)} .bm-l4{fill:var(--h4)}
.bm-sel{fill:var(--gold)!important}
.hair{fill:var(--bm-hair)}

.bm-info{text-align:center;font-size:13px;margin-top:6px;color:var(--ink)}

.nt-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 0}
.sw{flex:none;width:50px;height:30px;border-radius:99px;border:none;background:var(--surface-2);position:relative;padding:0;transition:background .2s}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}
.sw.on{background:var(--accent)} .sw.on i{left:23px}

.ai-logo{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#D97757,#C15F3C);color:#fff;font-size:18px;flex:none}

.fr-sheet{display:flex;flex-direction:column;gap:10px}
.fr-img{width:100%;max-height:220px;object-fit:cover;border-radius:14px}
.fr-item{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--bg)}
.fr-item .fbtn{height:36px;flex:none}

/* escaneo */
.scan-box{position:relative;border-radius:16px;overflow:hidden;background:#000}
.scan-box img{display:block;width:100%;max-height:300px;object-fit:cover;filter:saturate(1.1) contrast(1.05);animation:scanZoom 6s ease-in-out infinite alternate}
@keyframes scanZoom{from{transform:scale(1)}to{transform:scale(1.06)}}
.scan-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(94,144,234,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(94,144,234,.18) 1px,transparent 1px);background-size:28px 28px;mix-blend-mode:screen;animation:gridPulse 2s ease-in-out infinite}
@keyframes gridPulse{50%{opacity:.35}}
.scan-line{position:absolute;left:0;right:0;height:70px;top:-70px;background:linear-gradient(180deg,transparent,rgba(94,190,255,.15) 60%,rgba(120,220,255,.85) 96%,#fff);box-shadow:0 8px 24px rgba(120,220,255,.6);animation:scanMove 1.8s cubic-bezier(.45,0,.55,1) infinite}
@keyframes scanMove{0%{top:-70px}100%{top:100%}}
.sc{position:absolute;width:26px;height:26px;border:3px solid #7fdcff;filter:drop-shadow(0 0 6px #7fdcff)}
.sc.tl{top:10px;left:10px;border-right:none;border-bottom:none;border-radius:8px 0 0 0}
.sc.tr{top:10px;right:10px;border-left:none;border-bottom:none;border-radius:0 8px 0 0}
.sc.bl{bottom:10px;left:10px;border-right:none;border-top:none;border-radius:0 0 0 8px}
.sc.br{bottom:10px;right:10px;border-left:none;border-top:none;border-radius:0 0 8px 0}
.scan-tag{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:rgba(10,14,18,.72);backdrop-filter:blur(6px);color:#e8f6ff;border:1px solid rgba(127,220,255,.45);border-radius:99px;padding:7px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.scan-dot{width:9px;height:9px;border-radius:50%;background:#7fdcff;box-shadow:0 0 10px #7fdcff;animation:blink 1s infinite}
.scan-text{position:relative;overflow:hidden;border-radius:12px;background:var(--surface-2);padding:18px;text-align:center;font-weight:600}
.scan-text .scan-line{height:100%;top:0;left:-60%;right:auto;width:60%;background:linear-gradient(90deg,transparent,rgba(94,144,234,.35),transparent);box-shadow:none;animation:scanX 1.4s linear infinite}
@keyframes scanX{to{left:110%}}

.goal-cta{display:flex;align-items:center;gap:10px;text-align:left;width:100%;color:var(--ink);border-color:var(--accent)}
.goal-cta b{display:block}
.goal-cta>b{flex:none}

.dmk{position:absolute;top:3px;right:3px;display:flex;gap:2px}
.mk-f,.mk-w{display:inline-block;width:6px;height:6px;border-radius:50%}
.mk-f{background:var(--green)} .mk-w{background:var(--gold)}
.legend .mk-f,.legend .mk-w{width:8px;height:8px;margin-left:6px}
.month-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.month-sum div,.day-stats div{background:var(--surface-2);border-radius:10px;padding:8px;text-align:center;display:flex;flex-direction:column}
.month-sum b,.day-stats b{font-family:var(--display);font-size:22px;line-height:1.1}
.month-sum span,.day-stats span{font-size:11px;color:var(--muted)}
.day-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.dfood{display:flex;flex-direction:column;gap:8px}
.df-meal{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 12px 6px}
.df-h{display:flex;align-items:center;gap:8px;padding-bottom:5px;margin-bottom:2px;border-bottom:1px solid var(--line);font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;font-size:14px}
.df-dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
.df-k{margin-left:auto;font-family:var(--body-font);text-transform:none;font-weight:700;color:var(--accent);font-size:13px}
.df-row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:14px;line-height:1.3}
.df-row+.df-row{border-top:1px dashed color-mix(in srgb,var(--line) 70%,transparent)}
.df-n{min-width:0}.df-v{flex:none;color:var(--muted);font-size:13px}
.df-v::after{content:' kcal';font-size:11px}
.day-food summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:600;padding:2px 0}
.day-food div{margin-top:4px}

.usage{background:var(--surface-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.usage .bar{height:10px;background:var(--surface)}
.usage-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.usage-grid div{display:flex;flex-direction:column}
.usage-grid b{font-family:var(--display);font-size:20px}
.usage-grid span{font-size:11px;color:var(--muted)}

.page-head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:58px}
.page-head h2{font-size:30px;font-weight:800;line-height:1}
.ph-sub{font-size:13px;color:var(--muted);margin-top:3px;font-weight:600}
.ph-sub::first-letter{text-transform:uppercase}
.ph-right{display:flex;align-items:center;gap:6px;flex:none}
.sec-label{font-family:var(--display);font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.03em;margin-top:6px}
.wrap{width:100%}

.meals2{display:flex;flex-direction:column;gap:8px}
.meal2{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);transition:border-color .2s}
.meal2.done{border-color:color-mix(in srgb,var(--green) 55%,var(--line));background:linear-gradient(90deg,color-mix(in srgb,var(--green) 10%,var(--surface)),var(--surface) 60%)}
.m2-h{display:flex;align-items:center;gap:8px;padding:10px 12px}
.m2-toggle{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:none;padding:0;color:var(--ink);text-align:left}
.m2-toggle:disabled{opacity:1;cursor:default}
.m2-check{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.meal2.done .m2-check{background:var(--green);border-color:var(--green);color:#fff}
.m2-check svg{width:16px;height:16px}
.m2-t{flex:1;min-width:0;display:flex;flex-direction:column}
.m2-t b{font-family:var(--display);font-size:19px;text-transform:uppercase;letter-spacing:.02em;line-height:1.1}
.m2-t .small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m2-k{display:flex;flex-direction:column;align-items:flex-end;line-height:1}
.m2-k b{font-family:var(--display);font-size:22px}
.m2-k small{font-size:11px;color:var(--muted)}
.m2-chev{color:var(--muted);font-size:14px;width:14px}
.m2-items{border-top:1px solid var(--line);padding:4px 12px 8px}
.m2-item{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.m2-item:last-child{border-bottom:none}
.m2-n{flex:1;min-width:0;display:flex;flex-direction:column}
.m2-n span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m2-ik{font-weight:700;width:44px;text-align:right}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.stamp{display:none}}

/* ================= FOKUS · estilo ================= */
html{font-synthesis-weight:none;-webkit-font-smoothing:antialiased}
body{background:var(--bg);background-image:radial-gradient(120% 60% at 50% -10%,rgba(53,242,154,.05),transparent 60%);background-attachment:fixed;letter-spacing:-.005em}
h1,h2,h3{font-weight:400!important;letter-spacing:.02em}
header.top{background:rgba(8,12,14,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line-2);box-shadow:none}
.brand{gap:10px}
.brand-logo{width:32px;height:32px;border-radius:9px;object-fit:cover;flex:none;box-shadow:0 0 0 1px var(--line),0 4px 12px rgba(0,0,0,.4)}
header.top .brand h1{font-family:var(--brand-font);font-weight:900!important;letter-spacing:-.01em;font-size:clamp(18px,5vw,22px);color:#F5F7F8}
.chip{background:var(--surface);border-color:var(--line);border-radius:999px}
.chip.flame{background:rgba(245,197,66,.12);color:var(--gold);border:1px solid rgba(245,197,66,.25)}
.icon-btn{background:var(--surface)!important;border:1px solid var(--line)!important;border-radius:var(--r-m)!important;color:#A8B0B5}
.icon-btn.on{color:var(--accent)!important;border-color:rgba(53,242,154,.45)!important}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:18px;box-shadow:var(--shadow)}
.wrap{gap:12px}
.eyebrow{font-family:var(--body-font);font-weight:600;letter-spacing:.08em;font-size:11px;color:var(--muted)}
.btn{border-radius:var(--r-m);background:var(--surface);border-color:var(--line);font-weight:600;letter-spacing:.01em}
.btn.sm{border-radius:var(--r-s)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700;box-shadow:0 6px 18px -8px rgba(53,242,154,.55)}
.btn.primary:active:not(:disabled){background:var(--accent-dark);border-color:var(--accent-dark)}
.btn.big{font-size:22px;font-weight:400;letter-spacing:.06em}
.btn.danger.solid{background:var(--red);color:#1A0707}
.stat,.day-stats>div,.usage-grid>div{background:var(--bg-2)!important;border:1px solid var(--line-2);border-radius:var(--r-m)!important}
.stat b,.day-stats b,.usage-grid b{font-family:var(--body-font)!important;font-weight:800!important;letter-spacing:-.02em}
.sets td.n{font-family:var(--body-font);font-weight:800;font-size:15px}
.bar{height:8px;background:var(--line)}
.bar i{background:var(--accent)}
.tag{background:rgba(77,141,255,.12);color:var(--blue-soft)}
.inp{background:var(--bg-2);border-color:var(--line);border-radius:var(--r-s);font-weight:700}
.sets tr.done .inp{background:var(--accent-soft);color:var(--accent);border-color:rgba(53,242,154,.25)}
.check{border-radius:var(--r-s)}
.check.on{background:var(--accent);border-color:var(--accent);box-shadow:0 0 14px -4px rgba(53,242,154,.7)}
.check.on svg{stroke:var(--accent-ink)}
.ex.current,.card.current{border-color:rgba(53,242,154,.6)!important;background:var(--accent-soft)}
.pill{border-radius:999px}
.pill.on,.seg button.on{background:var(--accent)!important;color:var(--accent-ink)!important;border-color:var(--accent)!important}
.seg{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-m)}
.seg button{border-radius:calc(var(--r-m) - 4px)}
.linkbtn{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* navegación */
nav.tabs{background:#0B1012;border-top:1px solid #20292D}
nav.tabs button{color:#697378;font-family:var(--body-font);font-weight:600;font-size:9.5px;letter-spacing:.08em;position:relative;transition:color .2s}
nav.tabs button svg{stroke-width:2}
nav.tabs button.on{color:var(--accent)}
nav.tabs button.on svg{filter:drop-shadow(0 0 6px rgba(53,242,154,.55))}
nav.tabs button::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;border-radius:0 0 3px 3px;background:var(--accent);box-shadow:0 0 10px rgba(53,242,154,.8);opacity:0;transform:scaleX(.3);transition:opacity .25s,transform .25s}
nav.tabs button.on::before{opacity:1;transform:none}
/* cabecera de página con color de sección */
.page-head h2{position:relative;padding-left:12px}
.page-head h2::before{content:"";position:absolute;left:0;top:.12em;bottom:.18em;width:4px;border-radius:4px;background:var(--sec);box-shadow:0 0 10px -2px var(--sec)}
body[data-sec="hoy"],body[data-sec="rut"]{--sec:var(--blue)}
body[data-sec="food"]{--sec:var(--orange)}
body[data-sec="cal"]{--sec:var(--blue-soft)}
body[data-sec="prog"]{--sec:var(--accent)}
body[data-sec="aju"]{--sec:#A8B0B5}
/* IA */
.ai-logo{background:var(--ai-grad)!important;color:#fff!important}
.mic-fab{background:var(--ai-grad);box-shadow:0 8px 24px -6px rgba(154,107,255,.55),0 0 0 1px rgba(255,255,255,.08) inset}
.ai-entry{border-color:rgba(154,107,255,.35)!important;background:linear-gradient(135deg,rgba(154,107,255,.10),rgba(53,242,154,.05)),var(--surface)!important}
.ai-tool{border-color:var(--purple)}
.ai-act.ran{border-color:var(--accent)}
.ai-msg.me .ai-b{background:var(--accent)!important;color:var(--accent-ink)!important}
.vc-act{background:rgba(154,107,255,.10);border-left-color:var(--purple)}
/* comida */
.df-k{color:var(--orange)}
.meal2.done{border-color:rgba(53,242,154,.45);background:linear-gradient(90deg,rgba(53,242,154,.08),var(--surface) 60%)}
.meal2.done .m2-check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* números: Inter 800 */
#timer .clock,.cyc-day,.streak-big,.bigkg,.share .grid2 b,.pv b,.key,.rt-sr,.stepper b,.ring-in b,.goal-grid b,.month-sum b,.usage-grid b,.m2-k b,.stat b,.day-stats b{font-family:var(--body-font)!important;font-weight:800!important;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.streak-big{font-size:46px}.cyc-day{font-size:38px}.bigkg{font-size:40px}.ring-in b{font-size:28px}.goal-grid b,.m2-k b{font-size:18px}.rt-sr{font-size:15px}.key{font-size:22px}
.streak-big span{font-family:var(--display);font-weight:400;letter-spacing:.02em}
/* resumen semanal */
.card.share{background:linear-gradient(135deg,rgba(53,242,154,.16),rgba(53,242,154,.04) 55%),var(--surface);border:1px solid rgba(53,242,154,.4);color:var(--ink)}
.card.share .eyebrow{color:var(--accent);opacity:1}
.card.share .grid2 b{color:var(--ink)} .card.share .grid2 span{color:var(--muted);opacity:1}
.card.share .btn{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
/* series: tipo y nota */
.sets td.n{width:36px;padding:0!important}
.sn{width:34px;min-height:40px;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;color:inherit;position:relative;border-radius:8px;font-family:var(--body-font);font-weight:800;font-size:15px}
.sn:active{background:var(--surface-2)}
.sn em{font-style:normal;font-size:9.5px;font-weight:800;letter-spacing:.02em;color:var(--accent-ink);background:var(--gold);border-radius:4px;padding:0 3px;line-height:1.4}
.sn-dot{position:absolute;top:3px;right:1px;width:7px;height:7px;border-radius:50%;background:var(--purple)}
.sets tr.warm .inp{opacity:.65}
.sets tr.warm .sn em{background:var(--blue-soft)}
.set-note td{padding-top:0!important}
.set-note button{background:none;border:none;color:var(--muted);font-size:13px;text-align:left;padding:0 4px;line-height:1.35}
.inp.na{display:grid;place-items:center;color:var(--faint);border-style:dashed}
.sn-hint{font-size:12px;color:var(--muted);background:var(--bg-2);border:1px dashed var(--line);border-radius:10px;padding:7px 10px;margin-top:4px}
.st-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.st-opt{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:1px solid var(--line);background:var(--bg-2);border-radius:12px;color:var(--ink);font-size:12.5px;font-weight:600}
.st-opt b{font-size:13px;color:var(--gold);min-height:18px}
.st-opt.on{border-color:var(--accent);background:var(--accent-soft)}
.st-opt.on b{color:var(--accent)}
.st-desc{color:var(--muted);min-height:18px}
.set-sheet{display:flex;flex-direction:column;gap:10px}
.note-field{width:100%;min-height:56px;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--bg-2);padding:10px 12px;color:var(--ink);font-size:15px}
.sn-b{font-style:normal;font-size:10px;font-weight:800;color:var(--gold);margin-right:3px}
.sess-note{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;width:100%;color:var(--ink);padding:12px 16px!important}
.add-row{display:grid;grid-template-columns:2fr 1fr;gap:8px}
/* buscador: crear y variantes */
.pk-new{display:flex;align-items:center;gap:12px;width:100%;max-width:560px;margin:0 auto;text-align:left;background:var(--accent-soft);border:1.5px solid rgba(53,242,154,.5);border-radius:14px;padding:10px 14px;color:var(--ink)}
.pk-new b{display:block;font-size:16px;color:var(--accent)}
.pk-new span span{font-size:12.5px;color:var(--muted)}
.pk-plus{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:22px;font-weight:800;flex:none}
.picker.building>.pk-new,.picker.building>.pk-search,.picker.building>.pk-chips{display:none}
.pk-row{display:flex;gap:6px;align-items:stretch;margin-bottom:6px}
.pk-row .pk-item{margin:0;flex:1;min-width:0}
.pk-var{flex:none;border:1px solid var(--line);background:var(--bg-2);color:var(--muted);border-radius:12px;padding:0 10px;font-size:12px;font-weight:700}
.builder{padding:4px 0 24px}
.builder .rowx .pill{flex:none}
.b-prev{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.b-prev b{font-size:18px}
.b-prev .tag{align-self:flex-start}
/* movilidad */
.mob-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mob-card{display:flex;flex-direction:column;gap:3px;text-align:left;background:linear-gradient(135deg,rgba(154,107,255,.12),transparent 70%),var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;color:var(--ink)}
.mob-card b{font-size:15px}
.mob-card span{font-size:12px;color:var(--muted);line-height:1.3}
.mob-card em{font-style:normal;font-size:11.5px;color:var(--purple);font-weight:700;margin-top:2px}
/* plan */
.plan-card{border-color:rgba(77,141,255,.35)!important;background:linear-gradient(135deg,rgba(77,141,255,.10),transparent 60%),var(--surface)!important}
.days-seg button{padding:9px 2px;font-size:14px}
.plan-prev{display:flex;flex-direction:column;gap:4px}
.plan-prev div{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
.plan-prev .num{width:24px;height:24px;border-radius:8px;background:var(--bg-2);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--blue-soft)}
.toggle-row{display:flex;align-items:center;gap:10px;background:none;border:none;color:var(--ink);text-align:left;padding:2px 0;font-size:14px}
.tg{width:40px;height:24px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.tg i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.tg.on{background:var(--accent)} .tg.on i{transform:translateX(16px)}
.rp.next-plan{border-color:rgba(53,242,154,.6)!important;position:relative;padding-top:26px}
.np-tag{position:absolute;top:8px;left:18px;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
/* rutinas: pestañas y tarjetas plegadas */
.rt-tabs{margin-top:-4px}
.rt-tabs button{display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 4px;font-size:14px}
.rt-tabs button span{font-size:11px;min-width:18px;height:18px;border-radius:99px;background:var(--line);color:var(--muted);display:grid;place-items:center;padding:0 5px}
.rt-tabs button.on span{background:rgba(6,16,11,.2);color:var(--accent-ink)}
.rt-card{gap:8px;position:relative}
.rt-head h3{font-size:21px!important}
.rt-chev2{flex:none;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--bg-2);color:var(--muted);font-size:18px;line-height:1;display:grid;place-items:center;transition:transform .2s}
.rt-chev2.up{transform:rotate(180deg)}
.rt-card.fresh{animation:fresh 2.4s ease}
@keyframes fresh{0%,40%{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),0 0 24px rgba(53,242,154,.35)}100%{}}
.rt-card.next-plan{padding-top:28px}
.plan-head{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid rgba(77,141,255,.35);border-radius:14px;padding:10px 14px}
.plan-head b{display:block;font-size:15px}
.empty-c{display:flex;flex-direction:column;gap:4px;text-align:center;padding:22px 18px!important}

@keyframes rowhl{0%,35%{background:rgba(154,107,255,.28)}100%{}}
.sheet{overscroll-behavior:contain}

.act-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act-f{display:flex;flex-direction:column;gap:2px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--bg-2);color:var(--ink)}

.sess-div span{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);border-radius:99px;padding:3px 10px}
.sess-div b{font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:.02em;text-transform:uppercase}
/* comidas habituales */
.mt-days{font-size:12px;color:var(--faint);margin-top:2px}
.mt-days.on{color:var(--orange)}
.wd-row{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd-row button{height:42px;border-radius:12px;border:1px solid var(--line);background:var(--bg-2);color:var(--ink);font-weight:800}
.wd-row button.on{background:var(--orange);border-color:var(--orange);color:#1A0B03}
.mt-sug{display:flex;align-items:center;gap:8px;margin:0 12px 10px;padding:8px 10px;border-radius:12px;background:rgba(255,122,61,.10);border:1px dashed rgba(255,122,61,.45);font-size:14px}
.mt-sug>span{flex:1;min-width:0}
.mt-save{font-size:13px;margin:6px 0 2px}
/* ficha del día */
.mk-f{background:var(--orange)!important} .mk-a{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--blue)}
.legend .mk-a{width:8px;height:8px;margin-left:6px}
.sheet.day-sheet{height:92vh;max-height:92vh;display:flex;flex-direction:column;gap:12px;overflow:hidden;padding-bottom:calc(14px + var(--sab))}
.sheet.day-sheet>*{flex-shrink:0}
.sheet.day-sheet>.ds-body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;margin:0 -4px;padding:0 4px 6px;-webkit-overflow-scrolling:touch}
.ds-body>*{flex-shrink:0}
.sheet.day-sheet>.ds-actions{padding-top:8px;border-top:1px solid var(--line-2)}
.ds-top{display:flex;align-items:center;gap:8px}

.ds-date h2{font-size:28px;line-height:1}

.ds-chips .chip{font-size:12px}
.ds-chips .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.ds-rings{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.dr{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;background:var(--bg-2);border:1px solid var(--line-2);border-radius:16px;padding:10px 4px}
.dr-c{position:relative;width:72px;height:72px}
.dr-c svg{width:72px;height:72px;transform:rotate(-90deg)}
.dr-bg{fill:none;stroke:var(--line);stroke-width:7}
.dr-fg{fill:none;stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .5s}
.dr-c b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:800;letter-spacing:-.03em}
.dr-l{font-size:12px;font-weight:700}
.dr-s{font-size:10.5px;color:var(--muted);line-height:1.25;padding:0 2px}
.ds-tabs button{display:flex;align-items:center;justify-content:center;gap:6px}
.ds-tabs button span{font-size:11px;min-width:18px;height:18px;border-radius:99px;background:var(--line);color:var(--muted);display:grid;place-items:center;padding:0 5px}
.ds-tabs button.on span{background:rgba(6,16,11,.2);color:var(--accent-ink)}
.ds-body{display:flex;flex-direction:column;gap:8px}
.ds-card{border:1px solid var(--line);border-radius:14px;background:var(--bg-2);overflow:hidden}
.ds-card.open{border-color:rgba(77,141,255,.45)}
.ds-head{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;color:var(--ink);text-align:left;padding:10px 12px}
.ds-head b{display:block;font-size:15px}
.ds-ic{width:36px;height:36px;border-radius:11px;background:rgba(77,141,255,.14);display:grid;place-items:center;font-size:18px;flex:none}
.ds-chev{color:var(--muted);transition:transform .2s} .ds-card.open .ds-chev{transform:rotate(180deg)}
.ds-ex{padding:8px 12px 10px;border-top:1px solid var(--line-2)}
.ds-exh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.ds-t{width:100%;border-collapse:collapse;font-size:14px}
.ds-t td{padding:4px 4px;border-bottom:1px dashed var(--line-2)}
.ds-t td:first-child{width:22px} .ds-t td:nth-child(2){width:28px}
.ds-t tr.ds-n td{color:var(--muted);font-size:12.5px;border-bottom:1px dashed var(--line-2)}
.ds-stk{text-align:right;font-size:18px} .ds-stk .stk-img{width:24px;height:24px}
.ds-empty{text-align:center;color:var(--muted);font-size:14px;padding:18px 0}
.dmeal{border:1px solid var(--line);border-radius:12px;background:var(--bg-2);padding:0 12px}
.dmeal summary{display:flex;align-items:center;gap:8px;padding:10px 0;cursor:pointer;list-style:none}
.dmeal summary::-webkit-details-marker{display:none}
.dmeal summary b{font-size:14px}
.dmeal[open]{padding-bottom:6px}
.dn{background:var(--bg-2);border:1px solid var(--line-2);border-left:3px solid var(--purple);border-radius:10px;padding:8px 12px}
.dn div{font-size:14px;margin-top:2px}
.ds-actions{display:flex;gap:8px;flex-wrap:wrap}
.ds-actions .btn{flex:1}
.warn-s{display:block;font-size:12px;color:var(--gold)}
.warn-box{background:rgba(245,197,66,.12);border:1px solid rgba(245,197,66,.4);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--gold)}
/* rutinas más aireadas */
.rt-tiles{display:grid;gap:8px;margin:2px 0 6px}
.rt-tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px 4px 10px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--muted);min-width:0;transition:border-color .2s,background .2s}
.rt-ti{font-size:22px;line-height:1}
.rt-tl{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.rt-tc{position:absolute;top:6px;right:8px;font-size:11px;font-weight:800;color:var(--faint)}
.rt-tile.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);box-shadow:0 0 0 1px var(--accent) inset}
.rt-tile.on .rt-tc{color:var(--accent)}
body[data-sec="rut"] .wrap{gap:14px}
.rt-card{padding:16px 16px 14px!important}
.rt-card.next-plan{padding-top:34px!important}
.rt-card .np-tag{top:12px;left:16px}
.rt-top{gap:12px!important;align-items:center}
.rt-head .muted.small{margin-top:3px;line-height:1.4}
.mt-card .rt-top{flex-wrap:wrap}
.mt-card .rt-head{flex:1 1 100%}
.mt-card .rt-top .btn{flex:1}
.plan-head{margin-bottom:2px}
/* progreso */
.prog{display:flex;flex-direction:column;gap:14px}
.prog.anim>*{animation:pfade .45s cubic-bezier(.2,.8,.2,1) both}
.prog.anim>*:nth-child(2){animation-delay:.03s}.prog.anim>*:nth-child(3){animation-delay:.06s}.prog.anim>*:nth-child(4){animation-delay:.09s}.prog.anim>*:nth-child(5){animation-delay:.12s}.prog.anim>*:nth-child(6){animation-delay:.15s}.prog.anim>*:nth-child(n+7){animation-delay:.18s}
@keyframes pfade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.per-seg button{padding:8px 2px;font-size:13.5px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 14px 10px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi-l{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi b{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.kpi b small{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0}
.kd{font-size:12px;font-weight:700;color:var(--faint)} .kd.up{color:var(--accent)} .kd.down{color:var(--red)}
.kpi-sp{width:100%;height:26px;margin-top:6px;display:block}
.kpi-sp path{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lchart{width:100%;height:auto;display:block;overflow:visible}
.lc-g{stroke:var(--line-2);stroke-width:1}
.lc-t{fill:var(--faint);font-size:9.5px;font-family:var(--body-font);font-weight:600}
.lc-l{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.lc-d{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.lc-d.pr{fill:var(--gold);stroke:var(--gold)}
.lc-d.sel{fill:var(--accent);stroke:#fff;stroke-width:2}
.lc-hit{fill:transparent;cursor:pointer}
.lc-avg{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4}
.lc-ma{fill:none;stroke:var(--ink);stroke-width:1.4;opacity:.7;stroke-linecap:round}
.lc-tg{stroke:var(--accent);stroke-width:1.2;stroke-dasharray:5 4}
.lc-info{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;background:var(--bg-2);border:1px solid var(--line-2);border-radius:12px;padding:8px 12px}
.ex-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:0 2px 2px}
.ex-chips .pill{flex:none}
.lg-i{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.lg-i i{width:8px;height:8px;border-radius:3px;display:inline-block}
.pr-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:2px}
.pr-c{flex:none;min-width:140px;display:flex;flex-direction:column;gap:2px;background:linear-gradient(160deg,rgba(245,197,66,.10),transparent 60%),var(--bg-2);border:1px solid rgba(245,197,66,.25);border-radius:14px;padding:10px 12px}
.pr-c b{font-size:14px;line-height:1.25}
.pr-c .num{color:var(--gold);font-weight:800}
.mranges{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin-top:10px}

.mr-b{position:relative;height:6px;border-radius:99px;background:var(--line-2);overflow:hidden}
.mr-z{position:absolute;left:40%;width:40%;top:0;bottom:0;background:rgba(53,242,154,.16)}
.mr-v{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.mr-v.bajo{background:var(--faint)} .mr-v.ok{background:var(--accent)} .mr-v.alto{background:var(--gold)}
.mr-c{text-align:right;color:var(--muted);font-weight:700}
.bm-evo{margin-top:6px;display:flex;flex-direction:column;gap:2px}
.qbar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--line-2)}
.qbar i{display:block;height:100%}
.q-alert{font-size:13px;background:rgba(255,92,92,.10);border:1px solid rgba(255,92,92,.35);border-radius:12px;padding:8px 12px}
.meas{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ms{display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--bg-2);border:1px solid var(--line-2);border-radius:12px;padding:8px 2px;color:var(--ink);min-width:0}
.ms span{font-size:10.5px;color:var(--muted);font-weight:600}

.ph-cmp figcaption{position:absolute;left:8px;bottom:8px;font-size:11px;font-weight:700;background:rgba(8,12,14,.7);padding:2px 8px;border-radius:99px}

.ph-th{position:relative;flex:none;width:70px}
.ph-th img{width:70px;height:92px;object-fit:cover;border-radius:10px;display:block}
.ph-th span{font-size:10.5px;color:var(--muted)}
.ph-th .fx{position:absolute;top:3px;right:3px;width:22px;height:22px;background:rgba(8,12,14,.75);border-radius:50%}
.rep-card{border-color:rgba(154,107,255,.35)!important;background:linear-gradient(135deg,rgba(154,107,255,.10),rgba(53,242,154,.04) 60%),var(--surface)!important}

.best-d summary{display:flex;justify-content:space-between;align-items:center;cursor:pointer;list-style:none}

<script>
(function(){const t0=Date.now();const bar=()=>document.querySelector('#splash .sp-bar i');
  const set=v=>{const b=bar();if(b)b.style.width=v+'%'};requestAnimationFrame(()=>set(35));
  window.__splashDone=function(){set(100);const wait=Math.max(350,1500-(Date.now()-t0));
    setTimeout(()=>{const sp=document.getElementById('splash');if(sp){sp.classList.add('out');setTimeout(()=>sp.remove(),600)}},wait)};
  window.__splashStep=set;setTimeout(()=>window.__splashDone&&window.__splashDone(),4000);})();

(function(){
"use strict";
/* ---------- constantes ---------- */
const KINDS={easy:'Fácil',solid:'Justa',fail:'Al fallo',pain:'Molestia',other:'Otra'};
const BASE_STICKERS=[
  {id:'easy',emoji:'🔥',label:'Fácil',kind:'easy'},
  {id:'solid',emoji:'💪',label:'Justa',kind:'solid'},
  {id:'fail',emoji:'😵',label:'Al fallo',kind:'fail'},
  {id:'pain',emoji:'🤕',label:'Molestia',kind:'pain'}
];
const MUSCLES=['Pecho','Espalda','Hombros','Trapecio','Bíceps','Tríceps','Antebrazos','Core','Cuádriceps','Femoral','Glúteos','Gemelos','Movilidad'];
const DEFAULT_CFG={v:2,sex:'m',weeklyGoal:4,rest:90,stickers:[],routines:[
  {id:'push',name:'Empuje',ex:[{name:'Press banca',muscle:'Pecho',sets:4,reps:8},{name:'Press militar',muscle:'Hombros',sets:3,reps:10},{name:'Press inclinado mancuernas',muscle:'Pecho',sets:3,reps:12},{name:'Fondos',muscle:'Tríceps',sets:3,reps:10}]},
  {id:'pull',name:'Tirón',ex:[{name:'Dominadas',muscle:'Espalda',sets:4,reps:8},{name:'Remo con barra',muscle:'Espalda',sets:3,reps:10},{name:'Curl bíceps',muscle:'Bíceps',sets:3,reps:12},{name:'Face pull',muscle:'Hombros',sets:3,reps:15}]},
  {id:'legs',name:'Pierna',ex:[{name:'Sentadilla',muscle:'Cuádriceps',sets:4,reps:6},{name:'Peso muerto rumano',muscle:'Femoral',sets:3,reps:8},{name:'Hip thrust',muscle:'Glúteos',sets:3,reps:10},{name:'Elevación de gemelos',muscle:'Gemelos',sets:4,reps:15},{name:'Plancha (seg)',muscle:'Core',sets:3,reps:45}]}
]};
const DEFAULT_CYCLE={starts:[],cycleLen:28,periodLen:5,logs:{}};
const OBJECTS=[
  {n:'un gato',kg:4.5,e:'🐈'},{n:'una lavadora',kg:70,e:'🧺'},{n:'una moto',kg:180,e:'🏍️'},
  {n:'un piano de cola',kg:400,e:'🎹'},{n:'un coche',kg:1300,e:'🚗'},{n:'un elefante',kg:6000,e:'🐘'},
  {n:'un autobús',kg:12000,e:'🚌'},{n:'una ballena azul',kg:150000,e:'🐋'}
];
const LEVELS=[
  {at:0,name:'Iniciación',kg:5,c:'#EDEDEA',t:'#1B1B1B'},
  {at:5,name:'Constancia',kg:10,c:'#2E8B57',t:'#FFFFFF'},
  {at:15,name:'Progreso',kg:15,c:'#E0B000',t:'#1B1B1B'},
  {at:30,name:'Rendimiento',kg:20,c:'#1F5FBF',t:'#FFFFFF'},
  {at:60,name:'Élite',kg:25,c:'#C0322B',t:'#FFFFFF'}
];
const PHASES={
  men:{name:'Menstrual',c:'var(--ph-men)',tip:'Entrena según cómo te encuentres. Si hay dolor o cansancio, baja el peso un 10–20 % y prioriza la técnica. Si te sientes bien, entrena con normalidad: el ejercicio suave puede aliviar los calambres.'},
  fol:{name:'Folicular',c:'var(--ph-fol)',tip:'Muchas mujeres notan más energía en esta fase. Buen momento para subir cargas e intentar récords.'},
  ovu:{name:'Ovulatoria',c:'var(--ph-ovu)',tip:'Suele coincidir con el pico de energía. Aprovecha para series pesadas y calienta bien las articulaciones.'},
  lut:{name:'Lútea',c:'var(--ph-lut)',tip:'El esfuerzo puede sentirse mayor y el calor se tolera peor. Mantén las cargas, hidrátate y alarga un poco los descansos.'},
  lut2:{name:'Lútea tardía',c:'var(--ph-lut2)',tip:'Si notas síntomas premenstruales, reduce volumen y céntrate en técnica y constancia. Si no, sigue tu plan.'}
};
const SYMPTOMS=['Dolor','Cansancio','Hinchazón','Dolor de cabeza','Buen ánimo'];
const DOW=['L','M','X','J','V','S','D'];
const MONTHS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const WEEKDAYS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

/* ---------- estado ---------- */
const DEFAULT_FOOD={goal:null,days:{},weights:[],plan:null};
let cfg=clone(DEFAULT_CFG), sessions={}, cycle=clone(DEFAULT_CYCLE), food=clone(DEFAULT_FOOD);
const ui={tab:'hoy',calMonth:null,selDay:null,addEx:false,confirm:null,noteOpen:{},editSummary:false,newStk:{mode:'emoji',emoji:'',img:'',label:'',kind:'other'}};
let db=null, mode='loading', P=null;

/* ---------- utilidades ---------- */
function clone(o){return JSON.parse(JSON.stringify(o))}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pad(n){return String(n).padStart(2,'0')}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseYmd(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function today(){return ymd(new Date())}
function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return x}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function daysBetween(a,b){return Math.round((parseYmd(b)-parseYmd(a))/864e5)}
function fmtKg(n){return (Math.round(n*10)/10).toLocaleString('es-ES')}
function fmtBig(n){return Math.round(n).toLocaleString('es-ES')}
function num(v){if(v===''||v==null)return null;const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null}
function uid(){return Math.random().toString(36).slice(2,9)}
function shortDate(s){const d=parseYmd(s);return d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3)}
function allStickers(){return BASE_STICKERS.concat(cfg.stickers||[])}
function stickerById(id){return allStickers().find(s=>s.id===id)}
function stk(id){const s=stickerById(id);if(!s)return '';return s.img?`<img class="stk-img" src="${esc(s.img)}" alt="${esc(s.label)}">`:esc(s.emoji)}
function kindOf(id){const s=stickerById(id);return s?s.kind:null}
function key(name){return String(name||'').trim().toLowerCase()}
function isF(){return cfg.sex==='f'}

/* ---------- persistencia ---------- */
const pending={},timers={},inflight={};
function persistCfg(){persist(P&&P.cfg,cfg)}
function persistCycle(){persist(P&&P.cycle,cycle)}
function persistFood(){persist(P&&P.food,food)}
function persistSession(date){const s=sessions[date];persist(P&&(P.sess+'/'+date),s?s:{__del:true})}
function persist(path,data){
  if(mode!=='cloud'){saveLocal();return}
  pending[path]=clone(data);clearTimeout(timers[path]);timers[path]=setTimeout(()=>flush(path),450);
}
async function flush(path){
  if(inflight[path]){clearTimeout(timers[path]);timers[path]=setTimeout(()=>flush(path),300);return}
  const d=pending[path];if(!d)return;delete pending[path];inflight[path]=true;
  try{ if(d.__del) await db.doc(path).delete(); else await db.doc(path).set(d); }
  catch(e){
    if(e&&e.code==='unavailable'){ if(!pending[path])pending[path]=d; setTimeout(()=>flush(path),1200+Math.random()*1200); }
    else if(e&&e.code==='invalid_argument'){ toast('No tienes permiso para guardar. Pide acceso de edición.'); }
    else if(e&&e.code==='quota_exceeded'){ toast('Espacio lleno: borra algún entreno antiguo.'); }
    else toast('No se pudo guardar. Revisa la conexión.');
  }
  finally{inflight[path]=false;if(pending[path]){clearTimeout(timers[path]);timers[path]=setTimeout(()=>flush(path),300)}}
}
function busy(path){return !!(pending[path]||inflight[path])}
function saveLocal(){try{localStorage.setItem('cdh-state',JSON.stringify({cfg,sessions,cycle,food}))}catch(e){}}
function loadLocal(){try{const r=localStorage.getItem('cdh-state');if(r){const o=JSON.parse(r);if(o.cfg)cfg=Object.assign(clone(DEFAULT_CFG),o.cfg);if(o.sessions)sessions=o.sessions;if(o.cycle)cycle=Object.assign(clone(DEFAULT_CYCLE),o.cycle);if(o.food)food=Object.assign(clone(DEFAULT_FOOD),o.food)}}catch(e){}}

async function initStore(){
  let d=null,u=null,id=null;
  try{ if(window.claude&&window.claude.use){[d,u]=await Promise.all([window.claude.use('db'),window.claude.use('user')])} }catch(e){}
  if(u){try{id=await u.id()}catch(e){id=null}}
  if(!d||!id){ mode='local'; loadLocal(); setSync(); render(); return; }
  db=d; mode='cloud';
  const base='data/users/'+id;
  P={cfg:base+'/main',sess:base+'/main/sessions',cycle:base+'/cycle',food:base+'/food'};
  setSync();
  let migrated=false;
  db.doc(P.cfg).onSnapshot(async snap=>{
    if(busy(P.cfg))return;
    if(snap.exists){cfg=Object.assign(clone(DEFAULT_CFG),clone(snap.data()));render();return}
    if(!migrated){migrated=true;await migrateLegacy(u)}
    render();
  },()=>{});
  db.collection(P.sess).onSnapshot(q=>{
    const next={};
    q.docs.forEach(doc=>{const p=P.sess+'/'+doc.id;next[doc.id]=busy(p)?sessions[doc.id]:clone(doc.data())});
    Object.keys(sessions).forEach(k=>{if(busy(P.sess+'/'+k)&&!(k in next))next[k]=sessions[k]});
    Object.keys(next).forEach(k=>{if(!next[k])delete next[k]});
    sessions=next;render();
  },()=>{});
  db.doc(P.food).onSnapshot(snap=>{
    if(busy(P.food))return;
    if(snap.exists)food=Object.assign(clone(DEFAULT_FOOD),clone(snap.data()));
    render();
  },()=>{});
  db.doc(P.cycle).onSnapshot(snap=>{
    if(busy(P.cycle))return;
    if(snap.exists)cycle=Object.assign(clone(DEFAULT_CYCLE),clone(snap.data()));
    render();
  },()=>{});
}
async function migrateLegacy(u){
  // Solo el propietario hereda los datos guardados antes de separar los datos por persona.
  try{
    const owner=u?await u.isOwner():false;if(!owner)return;
    const old=await db.doc('app/config').get();
    if(old.exists){cfg=Object.assign(clone(DEFAULT_CFG),clone(old.data()));persistCfg()}
    const q=await db.collection('sessions').get();
    q.docs.forEach(doc=>{sessions[doc.id]=clone(doc.data());persistSession(doc.id)});
  }catch(e){}
}
function setSync(){
  const el=document.getElementById('sync');
  el.textContent=mode==='cloud'?'Tus datos se guardan solos y solo los ves tú':mode==='local'?'Guardado solo en este navegador':'Cargando tus datos…';
}

/* ---------- cálculos de entreno ---------- */
function sortedDates(){return Object.keys(sessions).filter(k=>sessions[k]).sort()}
function sessVolume(s){let v=0;(s.ex||[]).forEach(e=>(e.sets||[]).forEach(t=>{if(t.done&&effective(t)&&t.kg!=null&&t.reps!=null)v+=t.kg*t.reps}));return v}
function sessDoneSets(s){let n=0;(s.ex||[]).forEach(e=>(e.sets||[]).forEach(t=>{if(t.done)n++}));return n}
function trained(s){return s&&sessDoneSets(s)>0}
function history(name,before){
  const k=key(name),out=[];
  sortedDates().forEach(d=>{if(before&&d>=before)return;(sessions[d].ex||[]).forEach(e=>{if(key(e.name)===k)out.push({date:d,ex:e})})});
  return out;
}
function bestOf(name,before){
  let best=null;
  history(name,before).forEach(h=>(h.ex.sets||[]).forEach(t=>{
    if(!t.done||!effective(t)||t.kg==null||t.reps==null)return;
    if(!best||t.kg>best.kg||(t.kg===best.kg&&t.reps>best.reps))best={kg:t.kg,reps:t.reps,date:h.date};
  }));
  return best;
}
function lastOf(name,before){const h=history(name,before);return h.length?h[h.length-1]:null}
function recomputePR(date,ei){
  const e=sessions[date].ex[ei];const hist=bestOf(e.name,date);let top=-1;
  (e.sets||[]).forEach((t,j)=>{t.pr=false;if(!t.done||!effective(t)||t.kg==null||t.reps==null)return;
    if(top<0){top=j;return}const b=e.sets[top];if(t.kg>b.kg||(t.kg===b.kg&&t.reps>b.reps))top=j});
  if(top>=0&&hist){const t=e.sets[top];if(t.kg>hist.kg||(t.kg===hist.kg&&t.reps>hist.reps)){t.pr=true;return {set:t,name:e.name}}}
  return null;
}
function suggestion(name,date){
  const l=lastOf(name,date);if(!l)return null;
  const done=(l.ex.sets||[]).filter(t=>t.done);
  if(!done.length||!done.every(t=>kindOf(t.st)==='easy'))return null;
  const mx=Math.max(...done.map(t=>t.kg||0));if(!mx)return null;
  return mx+2.5;
}
function weekStats(monday){
  const days=[];let vol=0,sets=0,prs=0;const stks={},mus={};
  for(let i=0;i<7;i++){const d=ymd(addDays(monday,i));const s=sessions[d];const on=trained(s)||dayActs(d).length>0;days.push({d,on});
    if(s){vol+=sessVolume(s);(s.ex||[]).forEach(e=>(e.sets||[]).forEach(t=>{if(t.done){sets++;if(effective(t))mus[e.muscle]=(mus[e.muscle]||0)+1;if(t.pr)prs++;if(t.st)stks[t.st]=(stks[t.st]||0)+1}}))}}
  return {days,count:days.filter(x=>x.on).length,vol,sets,prs,stk:stks,mus};
}
function streakInfo(){
  const dates=[...new Set(sortedDates().filter(d=>trained(sessions[d])).concat(Object.keys(food.days||{}).filter(d=>dayActs(d).length)))].sort();
  const goal=Math.max(1,cfg.weeklyGoal||4);
  if(!dates.length)return {streak:0,wild:0,goal};
  let w=mondayOf(parseYmd(dates[0]));const cur=mondayOf(new Date());
  let streak=0,wild=0,met=0;
  while(w<=cur){
    const c=weekStats(w).count;const isCur=+w===+cur;
    if(c>=goal){streak++;met++;if(met%4===0)wild=Math.min(3,wild+1)}
    else if(!isCur){if(wild>0){wild--}else{streak=0}}
    w=addDays(w,7);
  }
  return {streak,wild,goal};
}
function heatLevels(){
  const vols=sortedDates().map(d=>sessVolume(sessions[d])).filter(v=>v>0).sort((a,b)=>a-b);
  const q=p=>vols[Math.min(vols.length-1,Math.floor(p*vols.length))];
  const a=vols.length?q(.25):0,b=vols.length?q(.5):0,c=vols.length?q(.8):0;
  return (s)=>{if(!trained(s))return 0;const v=sessVolume(s);if(v<=a)return 1;if(v<=b)return 2;if(v<=c)return 3;return 4};
}
function moodOf(s){
  const c={easy:0,solid:0,fail:0,pain:0,other:0};let top=null,topN=0;const byId={};
  (s.ex||[]).forEach(e=>(e.sets||[]).forEach(t=>{if(t.done&&t.st){const k=kindOf(t.st)||'other';c[k]++;byId[t.st]=(byId[t.st]||0)+1}}));
  Object.keys(byId).forEach(id=>{if(byId[id]>topN){topN=byId[id];top=id}});
  const total=Object.values(c).reduce((a,b)=>a+b,0);
  let title='Sin stickers',text='Marca cómo fue cada serie para ver el mood del entreno.';
  if(total){
    const dom=Object.keys(c).sort((a,b)=>c[b]-c[a])[0];
    if(c.pain>=2||c.pain/total>=.3){title='Día con molestias';text='Varias series con molestia. Baja la carga en esos ejercicios la próxima vez.'}
    else if(dom==='easy'){title='Paseo por el parque';text='Casi todo fácil. Toca subir pesos: la app te lo sugerirá.'}
    else if(dom==='solid'){title='Sesión sólida';text='Series exigentes pero controladas. Justo donde quieres estar.'}
    else if(dom==='fail'){title='Guerra total';text='Mucho al fallo. Descansa bien antes del próximo entreno.'}
    else {title='Entreno a tu manera';text='Tus stickers personalizados mandan hoy.'}
  }
  return {title,text,top,byId,total};
}
function compareObj(kg){
  if(kg<=0)return null;let o=OBJECTS[0];OBJECTS.forEach(x=>{if(kg>=x.kg)o=x});
  const n=kg/o.kg;return {o,n:n>=10?Math.round(n):Math.round(n*10)/10};
}
function levelOf(n){let i=0;LEVELS.forEach((l,j)=>{if(n>=l.at)i=j});return i}

/* ---------- cálculos del ciclo ---------- */
function starts(){return [...new Set(cycle.starts||[])].sort()}
function avgCycle(){
  const s=starts();const diffs=[];
  for(let i=1;i<s.length;i++){const d=daysBetween(s[i-1],s[i]);if(d>=18&&d<=45)diffs.push(d)}
  const recent=diffs.slice(-6);
  if(recent.length)return Math.round(recent.reduce((a,b)=>a+b,0)/recent.length);
  return Math.max(18,Math.min(45,cycle.cycleLen||28));
}
function phaseFor(day,L,Pd){
  const O=L-14;
  if(day<=Pd)return 'men';
  if(day>=O-1&&day<=O+1)return 'ovu';
  if(day<O-1)return 'fol';
  if(day>=L-4)return 'lut2';
  return 'lut';
}
function cycleInfo(date){
  if(!isF())return null;
  const s=starts().filter(x=>x<=date);if(!s.length)return null;
  const last=s[s.length-1];const L=avgCycle();const Pd=Math.max(2,Math.min(10,cycle.periodLen||5));
  const diff=daysBetween(last,date);const day=(diff%L)+1;
  const phase=phaseFor(day,L,Pd);
  return {day,L,P:Pd,phase,predicted:diff>=L,last,nextIn:L-day+1,O:L-14};
}

      x.drawImage(map,0,0,w,h);const md=x.getImageData(0,0,w,h).data;const g=new Uint8Array(w*h);for(let i=0;i<w*h;i++)g[i]=Math.round(md[i*4]/20);

        for(let i=0;i<o.g.length;i++){const g=o.g[i];if(!g)continue;const col=g===sel?C.sel:lvs[g-1]?C.l[lvs[g-1]]:null;if(!col)continue;

const PER=[[28,'4 sem'],[90,'3 meses'],[180,'6 meses'],[365,'Año']];

function inR(d,r){return d>=r[0]&&d<=r[1]}

  return `<svg class="kpi-sp" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${vals.map((x,i)=>`<rect x="${(i*bw+bw*.18).toFixed(2)}" y="${(H-Math.max(1.5,x/hi*H)).toFixed(2)}" width="${(bw*.64).toFixed(2)}" height="${Math.max(1.5,x/hi*H).toFixed(2)}" rx="1" style="fill:${col};opacity:${i===vals.length-1?1:.55}"/>`).join('')}</svg>`}

  if(unit){const d=Math.round((cur-prev)*10)/10;const good=invert?d<=0:d>=0;return `<span class="kd ${d===0?'':good?'up':'down'}">${d>0?'▲':d<0?'▼':'='} ${Math.abs(d).toLocaleString('es-ES')} ${unit}</span>`}
  if(!prev)return cur?'<span class="kd up">▲ nuevo</span>':'<span class="kd">—</span>';const d=Math.round((cur-prev)/prev*100);const good=invert?d<=0:d>=0;return `<span class="kd ${d===0?'':good?'up':'down'}">${d>0?'▲':d<0?'▼':'='} ${Math.abs(d)} %</span>`}

function renderPhaseStats(){
  if(!isF()||!starts().length)return '';
  const agg={};Object.keys(PHASES).forEach(k=>agg[k]={n:0,vol:0,easy:0,hard:0,sets:0});
  sortedDates().forEach(d=>{const s=sessions[d];if(!trained(s))return;const ci=cycleInfo(d);if(!ci)return;const a=agg[ci.phase];a.n++;a.vol+=sessVolume(s);
    (s.ex||[]).forEach(e=>(e.sets||[]).forEach(x=>{if(!x.done)return;a.sets++;const k=kindOf(x.st);if(k==='easy')a.easy++;if(k==='fail'||k==='pain')a.hard++}))});
  const any=Object.values(agg).some(a=>a.n);
  return `<div class="card"><div class="eyebrow">Tu entreno según la fase del ciclo</div>
    ${any?`<div style="overflow-x:auto"><table class="phase-table"><thead><tr><th>Fase</th><th>Entrenos</th><th>Kg medios</th><th>Series fáciles</th></tr></thead><tbody>
    ${Object.keys(PHASES).map(k=>{const a=agg[k];return `<tr><td><span class="rowx" style="gap:6px"><span class="dot" style="background:${PHASES[k].c}"></span>${PHASES[k].name}</span></td><td class="num">${a.n}</td><td class="num">${a.n?fmtBig(a.vol/a.n):'—'}</td><td class="num">${a.sets?Math.round(a.easy/a.sets*100)+' %':'—'}</td></tr>`}).join('')}
    </tbody></table></div><p class="disclaimer" style="margin-top:8px">Con más entrenos verás en qué fase rindes mejor tú, que es lo que de verdad importa.</p>`
    :'<div class="muted small">Cuando registres entrenos verás aquí cómo rindes en cada fase.</div>'}</div>`;
}
function weekText(){
  const st=streakInfo();const mon=mondayOf(new Date());const ws=weekStats(mon);const cmp=compareObj(ws.vol);
  const topStk=Object.keys(ws.stk).sort((a,b)=>ws.stk[b]-ws.stk[a]).slice(0,3).map(id=>{const s=stickerById(id);return s?(s.emoji||s.label)+'×'+ws.stk[id]:''}).join(' ');
  return `🏋️ Mi semana (${shortDate(ymd(mon))} – ${shortDate(ymd(addDays(mon,6)))})\n📅 ${ws.count}/${st.goal} días\n💪 ${ws.sets} series · ${fmtBig(ws.vol)} kg${cmp?` (${cmp.n.toLocaleString('es-ES')} × ${cmp.o.n} ${cmp.o.e})`:''}\n🏆 ${ws.prs} récords\n🔥 Racha: ${st.streak} semanas${topStk?`\n${topStk}`:''}`;
}

function startFrom(r){
  const t=today();
  const ex=exFromRoutine(r,t);
  sessions[t]={date:t,routineId:r?r.id:null,routineName:r?r.name:'Entreno libre',ex,finished:false,start:Date.now()};
  ui.editSummary=false;persistSession(t);render();
}
function addStart(d){
  if(!d)return;if(d>today()){toast('La fecha no puede ser futura');return}
  if(starts().includes(d)){toast('Esa fecha ya está registrada');return}
  cycle.starts=starts().concat([d]).sort();persistCycle();render();toast('Regla registrada: '+shortDate(d));
}

/* ---------- imágenes de stickers ---------- */
function drawToSticker(src,w0,h0){
  const S=256,c=document.createElement('canvas');c.width=S;c.height=S;const g=c.getContext('2d');
  g.imageSmoothingQuality='high';
  const k=Math.min(S/w0,S/h0);const w=w0*k,h=h0*k;g.drawImage(src,(S-w)/2,(S-h)/2,w,h);
  let url='';try{url=c.toDataURL('image/webp',.9)}catch(e){}
  if(!url.startsWith('data:image/webp'))url=c.toDataURL('image/png');
  return url;
}
async function loadImage(file){
  if(!file){toast('No llegó ninguna imagen');return}
  if(file.type&&!file.type.startsWith('image/')){toast('Ese archivo no es una imagen');return}
  toast('Cargando imagen…');
  let url=null;
  try{ if(window.createImageBitmap){const bm=await createImageBitmap(file);url=drawToSticker(bm,bm.width,bm.height);bm.close&&bm.close()} }catch(e){url=null}
  if(!url){ try{ url=await new Promise((res,rej)=>{const u=URL.createObjectURL(file);const img=new Image();
      img.onload=()=>{try{res(drawToSticker(img,img.naturalWidth,img.naturalHeight))}catch(e){rej(e)}finally{URL.revokeObjectURL(u)}};
      img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('decode'))};img.src=u}) }catch(e){url=null} }
  if(!url){ try{ url=await new Promise((res,rej)=>{const rd=new FileReader();rd.onerror=()=>rej(new Error('read'));
      rd.onload=()=>{const img=new Image();img.onload=()=>{try{res(drawToSticker(img,img.naturalWidth,img.naturalHeight))}catch(e){rej(e)}};img.onerror=()=>rej(new Error('decode'));img.src=rd.result};
      rd.readAsDataURL(file)}) }catch(e){url=null} }
  if(!url){toast('No se pudo leer esa imagen. Prueba con una captura de pantalla.');return}
  ui.newStk.mode='img';ui.newStk.img=url;render();toast('Imagen lista. Ponle nombre y crea el sticker');
}
function imageFromTransfer(dt){
  if(!dt)return null;
  if(dt.files&&dt.files.length){for(const f of dt.files){if(!f.type||f.type.startsWith('image/'))return f}}
  if(dt.items){for(const it of dt.items){if(it.kind==='file'&&it.type.startsWith('image/'))return it.getAsFile()}}
  return null;
}

const ACC={a:'á',e:'é',i:'í',o:'ó',u:'ú',A:'Á',E:'É',I:'Í',O:'Ó',U:'Ú'};
function openKb(o){
  closePad(false);
  kb=Object.assign({value:'',max:60,mode:'abc',accent:false,shift:false,placeholder:''},o);
  kb.value=kb.value||'';kb.shift=!kb.value;

function renderKb(){
  if(!kb){kbEl.innerHTML='';return}
  const up=kb.shift;
  const L=c=>up?c.toUpperCase():c;
  const K=(v,l,cls)=>`<button class="kk ${cls||''}" data-a="kk" data-v="${esc(v)}">${l==null?esc(v):l}</button>`;
  let rows;
  if(kb.mode==='abc'){
    rows=[
      'qwertyuiop'.split('').map(c=>K(L(c))).join(''),
      'asdfghjklñ'.split('').map(c=>K(L(c))).join(''),
      K('shift','⇧','fn '+(up?'on':''))+'zxcvbnm'.split('').map(c=>K(L(c))).join('')+K('del','⌫','fn')
    ];
  }else{
    rows=[
      '1234567890'.split('').map(c=>K(c)).join(''),
      ['-','/','(',')','+','×','%',':','"','ü'].map(c=>K(c)).join(''),
      K('#','#','fn')+['.',',','?','!',"'",'@','&'].map(c=>K(c)).join('')+K('del','⌫','fn')
    ];
  }
  const bottom=K('mode',kb.mode==='abc'?'123':'ABC','fn wide')+K('acc','´','fn '+(kb.accent?'on':''))+K('space','espacio','space')+K('.','.')+K('ok','OK','go wide');
  const prev=kb.noPreview?'':`<div class="kb-prev">${kb.value?esc(kb.value):`<span class="muted">${esc(kb.placeholder||'')}</span>`}<i class="caret"></i></div>`;
  kbEl.innerHTML=`<div class="pad kbd" role="dialog" aria-label="Teclado">

}
function kbKey(v){
  if(!kb)return;let val=kb.value;
  if(v==='shift'){kb.shift=!kb.shift;renderKb();return}
  if(v==='mode'){kb.mode=kb.mode==='abc'?'123':'abc';renderKb();return}
  if(v==='acc'){kb.accent=!kb.accent;renderKb();return}
  if(v==='ok'){closeKb(true);return}
  if(v==='del'){val=[...val].slice(0,-1).join('')}
  else{
    let ch=v==='space'?' ':v;
    if(kb.accent&&ACC[ch]){ch=ACC[ch]}
    kb.accent=false;
    if([...val].length>=kb.max){toast('Máximo '+kb.max+' caracteres');return}
    val+=ch;
    if(kb.shift&&ch!==' ')kb.shift=false;
  }
  if(!val)kb.shift=true;
  kb.value=val;if(kb.onInput)kb.onInput(val);renderKb();
}
function closeKb(done){
