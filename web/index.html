function padKey(v){
  if(!kp)return;
  const dec=kp.ctx==='set'?kp.f==='kg':!!FIELDS[kp.k].dec;
  let b=kp.buf;
  if(/^\d$/.test(v)){if(kp.fresh)b='';kp.fresh=false;
    if(b==='0')b='';const parts=b.split(',');
    if(parts.length>1&&parts[1].length>=2)return;if(b.replace(',','').length>=5)return;b+=v}
  else if(v===','){if(!dec)return;if(kp.fresh){b='0';kp.fresh=false}if(!b.includes(','))b=(b||'0')+','}
  else if(v==='del'){kp.fresh=false;b=b.slice(0,-1)}
  else if(v==='clr'){kp.fresh=false;b=''}
  else if(v==='+'||v==='-'){
    const step=kp.ctx==='set'?(kp.f==='kg'?2.5:(()=>{const e=sessions[today()].ex[kp.i];return exMeasure(e.name,e.muscle)==='time'?5:1})()):FIELDS[kp.k].step;
    let n=num(b)||0;n=Math.max(0,Math.round((n+(v==='+'?step:-step))*100)/100);
    b=dec?fmtKg(n):String(Math.round(n));kp.fresh=true}
  kp.buf=b;
  if(kp.ctx==='set')commitSet();
  renderPad();
}
function commitSet(){

  persistSession(today());

  if(el){el.textContent=x[kp.f]==null?(kp.f==='kg'?'kg':'reps'):(kp.f==='kg'?fmtKg(x[kp.f]):x[kp.f]);el.classList.toggle('ph',x[kp.f]==null)}
}
function commitField(){

  const r=F.dec?Math.round(n*100)/100:Math.round(n);
  const v=Math.max(F.min,Math.min(F.max,r));if(v!==r)toast(`Ajustado a ${v} (rango ${F.min}–${F.max})`);

function fuzzy(list,name,get){

function vcRun(a){

      while(e.sets.length<=j){const p=e.sets[e.sets.length-1];e.sets.push({kg:p?p.kg:null,reps:p?p.reps:null,done:false,st:null,pr:false})}

    case 'editar_serie':{const i=exI();const e=s.ex[i];const j=a.serie?a.serie-1:Math.max(0,e.sets.findIndex(x=>!x.done));if(!e.sets[j])throw 'Esa serie no existe';
      if(a.kg!=null)e.sets[j].kg=+a.kg;if(a.reps!=null)e.sets[j].reps=parseInt(a.reps);recomputePR(t,i);persistSession(t);return}
    case 'anadir_serie':{const e=s&&s.ex[exI()];const p=e.sets[e.sets.length-1];e.sets.push({kg:p?p.kg:null,reps:p?p.reps:null,done:false,st:null,pr:false});persistSession(t);return}
    case 'empezar_rutina':{if(s)throw 'Ya hay un entreno hoy';const i=rtIdx(a.rutina||'');if(i<0)throw 'No encuentro la rutina';startFrom(cfg.routines[i]);return}
    case 'empezar_libre':if(s)throw 'Ya hay un entreno hoy';startFrom(null);return;
    case 'anadir_ejercicio':{needS();const name=String(a.ejercicio||'Ejercicio').slice(0,40);const m=MUSCLES.includes(a.musculo)?a.musculo:(muscleOf(name)||'Core');
      const l=lastOf(name,t);const prev=l?(l.ex.sets||[]).filter(x=>x.done):[];const n=Math.max(1,Math.min(12,parseInt(a.series)||prev.length||3));const sets=[];

/* ---------- navegación con deslizamiento ---------- */
const TABS=['hoy','food','cal','prog','rut','aju'];
function goTab(t,fromDx){
  if(!TABS.includes(t))return;
  if(t===ui.tab){window.scrollTo({top:0,behavior:reduceMotion()?'auto':'smooth'});return}
  const dir=TABS.indexOf(t)>TABS.indexOf(ui.tab)?1:-1;
  ui.scrollMem=ui.scrollMem||{};ui.scrollMem[ui.tab]=window.scrollY;
  let ghost=null;const W=window.innerWidth;const dx=typeof fromDx==='number'?fromDx:0;
  if(!reduceMotion()){
    // copia visual de la pantalla que se va: se desliza a la vez que entra la nueva (sin fundidos)
    document.querySelectorAll('.view-ghost').forEach(g=>g.remove());
    const r=view.getBoundingClientRect();
    ghost=view.cloneNode(true);ghost.removeAttribute('id');ghost.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id'));
    ghost.className='wrap view-ghost';ghost.setAttribute('aria-hidden','true');
    ghost.style.cssText=`top:${r.top}px;left:${r.left-dx}px;width:${r.width}px;transform:translateX(${dx}px)`;
    document.body.appendChild(ghost);
  }
  ui.tab=t;ui.confirm=null;ui.rtOpen=null;
  if(t==='prog'){ui.progAnim=true;setTimeout(()=>{ui.progAnim=false},900)}
  render();window.scrollTo(0,ui.scrollMem[t]||0);
  if(!ghost){view.style.transform='';return}
  const start=dx?dx+dir*W:dir*W*0.9;
  view.style.transition='none';view.style.transform=`translateX(${start}px)`;
  void view.offsetWidth;
  const ease='transform .32s cubic-bezier(.22,.9,.25,1)';
  requestAnimationFrame(()=>{view.style.transition=ease;view.style.transform='translateX(0)';
    ghost.style.transition=ease;ghost.style.transform=`translateX(${-dir*W}px)`});
  const done=()=>{ghost.remove();view.style.transition='';view.style.transform=''};
  clearTimeout(goTab.tm);goTab.tm=setTimeout(done,360);
}
(function swipe(){
  let sx=0,sy=0,dx=0,active=false,locked=null,t0=0;
  const blocked=el=>!!(el.closest&&el.closest('.pk-chips,.ai-chips,.noswipe,.hscroll,input,textarea,select,.cal,.bodymap'));
  view.addEventListener('touchstart',e=>{if(e.touches.length!==1||blocked(e.target)){active=false;return}
    active=true;locked=null;sx=e.touches[0].clientX;sy=e.touches[0].clientY;dx=0;t0=Date.now()},{passive:true});
  view.addEventListener('touchmove',e=>{if(!active)return;const x=e.touches[0].clientX-sx,y=e.touches[0].clientY-sy;
    if(locked===null){if(Math.abs(x)>10||Math.abs(y)>10){locked=Math.abs(x)>Math.abs(y)*1.4?'x':'y';if(locked==='x')view.style.transition='none'}else return}
    if(locked!=='x')return;
    const i=TABS.indexOf(ui.tab);dx=x;if((i===0&&x>0)||(i===TABS.length-1&&x<0))dx=x*0.25;
    view.style.transform=`translateX(${dx}px)`},{passive:true});
  const end=()=>{if(!active)return;active=false;if(locked!=='x')return;
    const i=TABS.indexOf(ui.tab);const fast=Math.abs(dx)/(Date.now()-t0)>0.45;const next=(Math.abs(dx)>80||(fast&&Math.abs(dx)>30))?(dx<0?i+1:i-1):i;
    if(next!==i&&next>=0&&next<TABS.length)goTab(TABS[next],dx);
    else{view.style.transition='transform .25s cubic-bezier(.22,.9,.25,1)';view.style.transform='translateX(0)'}};
  view.addEventListener('touchend',end,{passive:true});view.addEventListener('touchcancel',end,{passive:true});
})();

const MEALS=[['desayuno','Desayuno'],['comida','Comida'],['merienda','Merienda'],['cena','Cena'],['picoteo','Picoteo']];
const ACTS=[['1.2','Sedentario','Trabajo sentado, poco movimiento'],['1.375','Ligero','Entrenas 1-3 días'],['1.55','Moderado','Entrenas 3-5 días'],['1.725','Alto','Entrenas 6-7 días o trabajo físico']];
const AIMS=[['lose','Perder grasa'],['recomp','Recomposición'],['maintain','Mantener'],['gain','Ganar músculo']];
function mealNow(){const h=new Date().getHours()+new Date().getMinutes()/60;return h<11?'desayuno':h<16.5?'comida':h<19.5?'merienda':h<23.5?'cena':'picoteo'}
function fday(d){return food.days[d]||{items:[]}}
function ftot(items,all){const t={kcal:0,p:0,c:0,f:0};(items||[]).forEach(x=>{if(!all&&x.ok===false)return;t.kcal+=+x.kcal||0;t.p+=+x.p||0;t.c+=+x.c||0;t.f+=+x.f||0});return t}
function lastWeight(){const w=food.weights||[];return w.length?w[w.length-1].kg:(food.goal&&food.goal.weight)||null}
function targets(){
  const g=food.goal;if(!g)return null;
  const w=lastWeight()||g.weight,h=g.height,a=g.age;if(!w||!h||!a)return null;
  const bmr=10*w+6.25*h-5*a+(isF()?-161:5);const tdee=bmr*(+g.act||1.55);
  const adj={lose:g.pace==='suave'?-0.10:-0.20,recomp:-0.05,maintain:0,gain:g.pace==='suave'?0.05:0.10}[g.aim]||0;
  const kcal=Math.round(Math.max(bmr,tdee*(1+adj))/10)*10;
  const p=Math.round(w*({lose:2.0,recomp:2.0,gain:1.8,maintain:1.6}[g.aim]||1.8));
  const f=Math.round(w*0.8);const c=Math.max(0,Math.round((kcal-p*4-f*9)/4));
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),kcal,p,c,f,weekly:Math.round((kcal-tdee)*7/7700*100)/100};
}
function ring(val,max){
  const r=52,C=2*Math.PI*r,pct=Math.min(1,max?val/max:0),over=max&&val>max;
  return `<svg viewBox="0 0 128 128" class="kring" role="img" aria-label="${Math.round(val)} de ${max} kcal"><circle cx="64" cy="64" r="${r}" class="kr-bg"/><circle cx="64" cy="64" r="${r}" class="kr-fg ${over?'over':''}" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}" transform="rotate(-90 64 64)"/></svg>`;
}
function macroBar(lbl,v,t,cls){const pct=t?Math.min(100,v/t*100):0;return `<div class="mbar"><div class="rowx between small"><b>${lbl}</b><span class="num muted">${Math.round(v)} / ${t} g</span></div><div class="bar"><i class="${cls}" style="width:${pct}%"></i></div></div>`}
function spark(ws){
  if(ws.length<2)return '';const W=280,H=60,vals=ws.map(x=>x.kg);const lo=Math.min(...vals)-0.5,hi=Math.max(...vals)+0.5;
  const pt=(x,i)=>[8+i*(W-16)/(ws.length-1),H-6-(x.kg-lo)/(hi-lo)*(H-14)];
  const pts=ws.map(pt);const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const L=pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" class="wspark" role="img" aria-label="Evolución del peso"><path d="${d} L${L[0]},${H} L${pts[0][0]},${H}Z" class="ws-a"/><path d="${d}" class="ws-l"/><circle cx="${L[0]}" cy="${L[1]}" r="4" class="ws-d"/></svg>`;
}

  const [r,g,b]=m.map(Number);const hex='#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
  const light=(0.299*r+0.587*g+0.114*b)>150;const k=hex+light;if(k===syncBars.last)return;syncBars.last=k;
  try{window.CdhNative.setBars(hex,light)}catch(e){}
}

function nextSet(s){
  if(!s||s.finished)return null;
  for(let i=0;i<(s.ex||[]).length;i++){const ss=s.ex[i].sets||[];for(let j=0;j<ss.length;j++){if(!ss[j].done)return {i,j}}}
  return null;
}

function reduceMotion(){try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function comparePhrase(t,i,j){
  const s=sessions[t];const e=s.ex[i];const x=e.sets[j];
  const done=e.sets.filter(q=>q.done);
  const last=lastOf(e.name,t);
  if(!last)return pick([`Primera vez con ${e.name}: ya tienes tu marca de partida`,`${e.name} estrenado. La próxima vez tendrás con qué compararte`]);
  const when=shortDate(last.date);const prevDone=(last.ex.sets||[]).filter(q=>q.done);
  // ejercicio terminado: compara volumen
  if(done.length===e.sets.length&&prevDone.length){
    const v=done.reduce((a,q)=>a+(q.kg||0)*(q.reps||0),0),pv=prevDone.reduce((a,q)=>a+(q.kg||0)*(q.reps||0),0);
    if(pv>0){const d=Math.round((v-pv)/pv*100);
      if(d>0)return `${e.name} terminado: +${d} % de volumen que el ${when}`;
      if(d===0)return `${e.name} terminado: mismo volumen que el ${when}`;
      return `${e.name} terminado: ${Math.abs(d)} % menos que el ${when}. Hay días así`;}
  }
  const p=prevDone[Math.min(j,prevDone.length-1)];
  if(!p||x.kg==null||x.reps==null||p.kg==null||p.reps==null)return pick(['Serie hecha. Respira y a por la siguiente','Una menos. Sigue así']);
  const dk=Math.round((x.kg-p.kg)*10)/10,dr=x.reps-p.reps;
  if(dk>0)return pick([`+${fmtKg(dk)} kg que el ${when} en esta serie`,`Más peso que el ${when}: ${fmtKg(p.kg)} → ${fmtKg(x.kg)} kg`]);
  if(dk===0&&dr>0)return `${dr} rep${dr===1?'':'s'} más que el ${when} con el mismo peso`;
  if(dk===0&&dr===0)return pick([`Igual que el ${when}. Sólido`,`Calcado al ${when}: ${fmtKg(x.kg)} × ${x.reps}`]);
  if(dk<0&&x.kg*x.reps>=p.kg*p.reps)return `Menos peso pero más trabajo total que el ${when}`;
  return `El ${when} hiciste ${fmtKg(p.kg)} × ${p.reps}. Hoy toca consolidar`;
}
